on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-esp32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git ca-certificates curl unzip python3 python3-pip jq

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version

      - name: Prepare Arduino CLI config
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Install esp32 core and libraries
        run: |
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson@6.21.3" || true
          arduino-cli lib install "WebSockets" || true

      - name: Show available boards (debug)
        run: arduino-cli board listall

      - name: Compile all sketches for DOIT ESP32 DevKit V1
        run: |
          mkdir -p build_output
          for sketch in sketches/*/; do
            if [ -d "$sketch" ]; then
              sketch_name=$(basename "$sketch")

              # Ensure there is an .ino file matching the folder name (Arduino requirement)
              if [ ! -f "$sketch/$sketch_name.ino" ]; then
                first_ino=$(find "$sketch" -maxdepth 1 -name "*.ino" | head -n 1)
                if [ -n "$first_ino" ]; then
                  echo "Fixing naming: Renaming $first_ino to $sketch/$sketch_name.ino"
                  mv "$first_ino" "$sketch/$sketch_name.ino"
                else
                  echo "No .ino file found in $sketch, skipping."
                  continue
                fi
              fi

              echo "=== Compiling $sketch_name ==="
              mkdir -p "build_output/$sketch_name"
              arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --output-dir "build_output/$sketch_name" "$sketch"
            fi
          done

      - name: List all build artifacts
        run: |
          ls -laR build_output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmwares
          path: build_output/

      - name: Commit compiled firmwares back to the repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p compiled_firmwares
          # Copy all .bin files to compiled_firmwares folder
          find build_output -type f -name "*.bin" -exec cp {} compiled_firmwares/ \;

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compiled_firmwares/
          git commit -m "Auto-build: update compiled firmwares" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
